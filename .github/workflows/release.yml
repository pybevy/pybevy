name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: dist

  build-wheels:
    name: Build ${{ matrix.target }} (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (manylinux_2_28 = RHEL-based, uses dnf)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python-version: "3.12"
            maturin-args: --features linux-display -i python3.12
            before-script: dnf install -y alsa-lib-devel systemd-devel wayland-devel
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python-version: "3.13"
            maturin-args: --features linux-display -i python3.13
            before-script: dnf install -y alsa-lib-devel systemd-devel wayland-devel
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python-version: "3.14"
            maturin-args: --features linux-display -i python3.14
            before-script: dnf install -y alsa-lib-devel systemd-devel wayland-devel

          # Linux aarch64 - disabled (cross-compiling wayland/display libs is complex)
          # - os: ubuntu-latest
          #   target: aarch64-unknown-linux-gnu
          #   python-version: "3.12"
          #   maturin-args: --features linux-display -i python3.12
          # - os: ubuntu-latest
          #   target: aarch64-unknown-linux-gnu
          #   python-version: "3.13"
          #   maturin-args: --features linux-display -i python3.13
          # - os: ubuntu-latest
          #   target: aarch64-unknown-linux-gnu
          #   python-version: "3.14"
          #   maturin-args: --features linux-display -i python3.14

          # macOS aarch64 (Apple Silicon)
          - os: macos-14
            target: aarch64-apple-darwin
            python-version: "3.12"
            maturin-args: -i python3.12
          - os: macos-14
            target: aarch64-apple-darwin
            python-version: "3.13"
            maturin-args: -i python3.13
          - os: macos-14
            target: aarch64-apple-darwin
            python-version: "3.14"
            maturin-args: -i python3.14

          # macOS x86_64 (cross-compiled from Apple Silicon)
          - os: macos-14
            target: x86_64-apple-darwin
            python-version: "3.12"
            maturin-args: -i python3.12
          - os: macos-14
            target: x86_64-apple-darwin
            python-version: "3.13"
            maturin-args: -i python3.13
          - os: macos-14
            target: x86_64-apple-darwin
            python-version: "3.14"
            maturin-args: -i python3.14

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-version: "3.12"
            maturin-args: -i python3.12
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-version: "3.13"
            maturin-args: -i python3.13
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-version: "3.14"
            maturin-args: -i python3.14

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --out dist-raw --profile package-release --auditwheel skip ${{ matrix.maturin-args }}
          sccache: true
          manylinux: "2_28"
          before-script-linux: ${{ matrix.before-script }}
        env:
          MATURIN_PYTHON_VERSION: ${{ matrix.python-version }}

      # Linux: maturin's built-in auditwheel doesn't support --exclude, so we
      # skip it above and use the external auditwheel tool to exclude system libs
      # that break when bundled (ALSA needs dlopen'd plugins, wayland needs the
      # user's compositor, libffi is universally present)
      - name: Repair wheels (exclude system libs)
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install auditwheel patchelf
          mkdir -p dist
          for whl in dist-raw/*.whl; do
            auditwheel repair "$whl" \
              --exclude libasound.so.2 \
              --exclude libwayland-client.so.0 \
              --exclude libffi.so.6 \
              --exclude libffi.so.8 \
              --plat manylinux_2_28_x86_64 \
              -w dist
          done

      - name: Collect wheels (non-Linux)
        if: runner.os != 'Linux'
        shell: bash
        run: mv dist-raw dist

      - name: Verify wheel contents
        shell: bash
        run: |
          for whl in dist/*.whl; do
            echo "Checking $whl..."
            contents=$(zipinfo -1 "$whl")

            # Verify license files are present
            echo "$contents" | grep -q "LICENSE-APACHE" || { echo "ERROR: LICENSE-APACHE missing from $whl"; exit 1; }
            echo "$contents" | grep -q "LICENSE-MIT" || { echo "ERROR: LICENSE-MIT missing from $whl"; exit 1; }

            # Verify no unexpected .so/.dylib/.dll files (only the _pybevy extension module)
            unexpected=$(echo "$contents" | grep -E '\.(so|dylib|dll)' | grep -v '_pybevy\.cpython-' || true)
            if [ -n "$unexpected" ]; then
              echo "ERROR: Unexpected shared libraries in $whl:"
              echo "$unexpected"
              exit 1
            fi
          done
          echo "All wheels verified."

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}-py${{ matrix.python-version }}
          path: dist

  # publish:
  #   name: Publish to PyPI
  #   runs-on: ubuntu-latest
  #   needs: [build-sdist, build-wheels]
  #   if: github.event_name == 'release'
  #   permissions:
  #     id-token: write
  #   environment:
  #     name: pypi
  #     url: https://pypi.org/p/pybevy
  #   steps:
  #     - uses: actions/download-artifact@v4
  #       with:
  #         pattern: dist-*
  #         path: dist
  #         merge-multiple: true
  #
  #     - name: Publish to PyPI
  #       uses: PyO3/maturin-action@v1
  #       with:
  #         command: upload
  #         args: --non-interactive --skip-existing dist/*

  upload-release-assets:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: [build-sdist, build-wheels]
    if: github.event_name == 'release'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber --repo "${{ github.repository }}"
