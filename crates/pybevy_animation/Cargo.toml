[package]
name = "pybevy_animation"
version = "0.2.0"
edition = "2024"
description = "Animation types for PyBevy"
license = "MIT OR Apache-2.0"

[dependencies]
pyo3 = { workspace = true, features = ["macros"] }
uuid = { workspace = true }
pybevy_core = { path = "../pybevy_core" }
pybevy_macros = { path = "../pybevy_macros" }
pybevy_mesh = { workspace = true }

[dependencies.bevy]
workspace = true
features = ["gltf_animation", "bevy_render"]
