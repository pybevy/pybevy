[package]
name = "pybevy_input_focus"
version = "0.3.0-rc.1"
edition = "2024"
description = "Input focus types for PyBevy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pybevy/pybevy"
homepage = "https://pybevy.com"

[dependencies]
pyo3 = { workspace = true, features = ["macros"] }
pybevy_core = { workspace = true }
pybevy_macros = { workspace = true }
numpy = { workspace = true }

[dependencies.bevy]
workspace = true
features = ["bevy_input_focus"]

[lints]
workspace = true
