[package]
name = "pybevy_storage"
version = "0.3.0-rc.1"
edition = "2024"
description = "PyO3-free storage primitives for PyBevy - validity tracking, borrowed references"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pybevy/pybevy"
homepage = "https://pybevy.com"

[dependencies]
bevy = { workspace = true, features = ["bevy_asset"] }
smallvec = { workspace = true }

[dependencies.pyo3]
workspace = true
optional = true

[features]
# Domain shapes for the magnitudes inside UI and text values.
ui = ["bevy/bevy_ui"]
text = ["bevy/bevy_text"]

[lints]
workspace = true
