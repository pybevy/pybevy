[package]
name = "pybevy_core"
version = "0.2.0"
edition = "2024"
description = "Core storage primitives for PyBevy - validity tracking, borrowed references, runtime type registry"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pybevy/pybevy"
homepage = "https://pybevy.com"

[dependencies]
pybevy_storage = { path = "../pybevy_storage", version = "=0.2.0", features = ["pyo3"] }
pyo3 = { workspace = true, features = ["macros"] }
pybevy_macros = { path = "../pybevy_macros", version = "=0.2.0" }
uuid = { workspace = true }
serde_json = "1.0"

# Bevy core (ecs, app) is always included. Only need to specify optional features.
[dependencies.bevy]
workspace = true
features = [
    "bevy_asset",
    "bevy_color",
]
