[package]
name = "pybevy_shape"
version = "0.3.0-rc.1"
edition = "2024"
description = "Geometric primitives, bounding volumes, and rays for PyBevy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pybevy/pybevy"
homepage = "https://pybevy.com"

[dependencies]
pyo3 = { workspace = true, features = ["macros"] }
pybevy_core = { workspace = true }
pybevy_macros = { workspace = true }
pybevy_math = { workspace = true }

[dependencies.bevy]
workspace = true

[lints]
workspace = true
