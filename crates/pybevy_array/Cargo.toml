[package]
name = "pybevy_array"
version = "0.3.0"
edition = "2024"
description = "Bounded array core and backend adapters for PyBevy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pybevy/pybevy"
homepage = "https://pybevy.com"

[features]
default = ["pyo3"]
numeric = ["dep:pybevy_bytecodevm"]
pyo3 = ["numeric", "dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { workspace = true, optional = true }
numpy = { workspace = true, optional = true }
half.workspace = true
pybevy_bytecodevm = { path = "../pybevy_bytecodevm", version = "=0.3.0", features = ["parallel"], optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "elementwise"
harness = false

[lints]
workspace = true
