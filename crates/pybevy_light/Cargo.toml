[package]
name = "pybevy_light"
version = "0.2.1"
edition = "2024"
description = "Light components for PyBevy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pybevy/pybevy"
homepage = "https://pybevy.com"

[dependencies]
pyo3 = { workspace = true, features = ["macros"] }
pybevy_core = { workspace = true }
pybevy_color = { workspace = true }
pybevy_camera = { workspace = true }
pybevy_macros = { workspace = true }
pybevy_math = { workspace = true }
numpy = { workspace = true }

[dependencies.bevy]
workspace = true
features = [
    "bevy_pbr",
    "bevy_light",
    # Embeds the LTC lookup textures RectLight needs to render; the LUTs are
    # zstd-compressed KTX2, so a zstd backend must be chosen (pure-Rust one)
    "area_light_luts",
    "zstd_rust",
]

[lints]
workspace = true
