# PyBevy type name mappings to Bevy types
# Format: "PyBevyName" = "BevyName" or "PyBevyName" = "bevy_crate::module::BevyName"
[bevy.type_mappings]
PyAudioPlayerBase = "AudioPlayer"
# When PyBevy uses different names than Bevy
PyTransform = "Transform"
PyVec3 = "Vec3"
PyVec2 = "Vec2"
PyQuat = "Quat"
PyMat4 = "Mat4"
PyMat3 = "Mat3"
# bevy_pbr::ForwardDecalMaterial<B> aliases ExtendedMaterial<B, ForwardDecalMaterialExt>.
PyForwardDecalMaterial = "ExtendedMaterial"
# Concrete generic specializations declared by the wrappers' storage macros.
PyMouseInput = "ButtonInput"
PyMeshMaterial3dForwardDecal = "MeshMaterial3d"
PyMeshMaterial3dShader = "MeshMaterial3d"
# bevy_animation::graph::AnimationNodeIndex aliases petgraph::graph::NodeIndex<u32>;
# claim the Bevy alias name so the inventory lookup resolves it.
PyAnimationNodeIndex = "AnimationNodeIndex"
PyMeshMaterial3dStorageShader = "MeshMaterial3d"

# Generic type specializations in Bevy -> PyBevy separate types
# These specialized types have their own impl blocks in Bevy
# Note: Use Py-prefixed names as that's what the Rust parser extracts
PyTimeVirtual = "Time<Virtual>"
PyTimeReal = "Time<Real>"
PyTimeFixed = "Time<Fixed>"

# Wrappers of one instantiation of a generic Bevy type: the base resolves the
# upstream item, the arguments replace its type parameters when comparing.
[bevy.generic_instances]
PyCubicBezier2d = "CubicBezier<Vec2>"
PyCubicBezier3d = "CubicBezier<Vec3>"
PyCubicBSpline2d = "CubicBSpline<Vec2>"
PyCubicBSpline3d = "CubicBSpline<Vec3>"
PyCubicCardinalSpline2d = "CubicCardinalSpline<Vec2>"
PyCubicCardinalSpline3d = "CubicCardinalSpline<Vec3>"
PyCubicHermite2d = "CubicHermite<Vec2>"
PyCubicHermite3d = "CubicHermite<Vec3>"
PyCubicNurbs2d = "CubicNurbs<Vec2>"
PyCubicNurbs3d = "CubicNurbs<Vec3>"
PyLinearSpline2d = "LinearSpline<Vec2>"
PyLinearSpline3d = "LinearSpline<Vec3>"
PyCubicCurve2d = "CubicCurve<Vec2>"
PyCubicCurve3d = "CubicCurve<Vec3>"
PyRationalCurve2d = "RationalCurve<Vec2>"
PyRationalCurve3d = "RationalCurve<Vec3>"
PyCubicSegment2d = "CubicSegment<Vec2>"
PyCubicSegment3d = "CubicSegment<Vec3>"
PyRationalSegment2d = "RationalSegment<Vec2>"
PyRationalSegment3d = "RationalSegment<Vec3>"

