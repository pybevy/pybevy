# Method exclusions - methods that shouldn't be compared
[bevy.excluded_methods]
# Methods that exist in Bevy but shouldn't be exposed in Python
patterns = [
    # Reflection traits - not relevant for Python
    "from_reflect",
    "type_path",
    "type_path_table",
    "short_type_path",
    "type_ident",
    "crate_name",
    "module_path",
    "get_type_registration",
    "register_type",
    "as_reflect",
    "as_reflect_mut",
    "reflect_*",
    "clone_value",
    "as_any",
    "as_any_mut",
    "as_partial_reflect",
    "as_partial_reflect_mut",
    "into_partial_reflect",
    "try_into_reflect",
    "try_as_reflect",
    "try_as_reflect_mut",

    # Reflect struct/enum methods
    "field",
    "field_mut",
    "field_at",
    "field_at_mut",
    "field_len",
    "name_at",
    "index_of",
    "iter_fields",
    "clone_dynamic",
    "variant_name",
    "variant_index",
    "variant_type",

    # Standard Rust traits - have Python equivalents handled differently
    "clone",      # Python uses copy protocol
    "fmt",        # Python uses __repr__/__str__
    "hash",       # Python uses __hash__
    "partial_cmp", # Python uses comparison operators
    "cmp",

    # Internal/unsafe methods
    "into_inner",
    "from_raw_parts",
    "as_ptr",
    "as_mut_ptr",

    # More reflection methods
    "get_represented_type_info",
    "into_any",
    "into_reflect",
    "register_type_dependencies",
    "clone_behavior",
    "register_required_components",

    # Debug/Display trait methods
    "debug",

    # Operator overloads - Python uses __mul__, __add__ etc
    "mul",
    "add",
    "sub",
    "div",
    "neg",
    "mul_assign",
    "add_assign",
    "sub_assign",
    "div_assign",

    # More reflection methods
    "set",
    "try_apply",
    "type_info",
    "to_dynamic_struct",
    "to_dynamic_tuple_struct",
    "to_dynamic_enum",
    "to_dynamic_tuple",
    "to_dynamic_list",
    "to_dynamic_array",
    "to_dynamic_map",
    "on_insert",
    "on_add",
    "on_remove",
    "on_replace",

    # Internal Vec3A variants (Bevy optimization, not needed in Python)
    "*_vec3a",

    # Serde traits - Python uses pickle/json differently
    "serialize*",
    "deserialize*",

    # Deref trait methods - Rust-specific pattern
    "deref",
    "deref_mut",

    # Bevy 0.18+ relationship accessor - internal ECS machinery, not user-facing
    "relationship_accessor",

    # Entity remapping trait - internal ECS machinery
    "map_entities",
]

# Methods that can be auto-detected via PyBevy attributes
# These won't be marked as "missing" if PyBevy has equivalent
# Excluded traits - methods from these traits are skipped entirely
# These traits have Rust-specific semantics that don't map to Python
[bevy.excluded_traits]
traits = [
    # Asset visitor - internal Bevy asset system
    "VisitAssetDependencies",

    # Bevy audio internal trait
    "Decodable",

    # Text span access trait - internal, PyBevy uses text property getter/setter instead
]

# Per-type ignore configuration
# Use [bevy.type_ignores.TypeName] to configure ignores for specific types
#
# Available options:
#   ignore_constructor_warnings = true       # Suppress all constructor param warnings
#   ignore_constructor_params = ["param"]    # Suppress specific param warnings
#   intentional_signature_diffs = ["method"] # Mark signature diffs as intentional
#   intentional_missing_methods = ["method"] # Mark missing methods as intentional
#   intentional_missing_fields = ["field"]   # Mark missing fields as intentional
#
# Examples (commented out - uncomment when needed):
#
# # Transform: Constructor defaults are intentional per CLAUDE.md (PyO3 direct defaults pattern)
# [bevy.type_ignores.Transform]
# ignore_constructor_warnings = true
# intentional_signature_diffs = ["from_matrix", "mul_transform"]
# intentional_missing_methods = ["from_isometry", "to_isometry"]
#
# # Window: Constructor defaults are intentional for ergonomics
# [bevy.type_ignores.Window]
# ignore_constructor_warnings = true

# AudioSink: Constructor takes rodio::Sink which is an internal Bevy type
# The AudioSink component is created by Bevy's audio system, not by user code
# Users spawn AudioPlayer with PlaybackSettings, and Bevy creates the sink
[bevy.type_ignores.AudioSink]
intentional_missing_methods = ["new"]
notes = "new(Sink) not implementable - Sink is from rodio, internal to Bevy's audio system"

[bevy.type_ignores.TaskPoolThreadAssignmentPolicy]
ignore_constructor_params = ["on_thread_spawn", "on_thread_destroy"]
intentional_missing_fields = ["on_thread_spawn", "on_thread_destroy"]
notes = "Bevy worker-thread lifecycle callbacks cannot retain and invoke Python without a reviewed free-threading and exception-delivery contract"

# SpatialAudioSink: Same as AudioSink, uses rodio::SpatialSink
[bevy.type_ignores.SpatialAudioSink]
intentional_missing_methods = ["new"]
notes = "new(SpatialSink) not implementable - SpatialSink is from rodio, internal to Bevy's audio system"

# ButtonInput<T> generic - lint skips generic bases, methods exist in impl<T> ButtonInput<T>
