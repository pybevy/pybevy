# FontAtlas - Low-level text rendering pipeline type
# Users interact with Text2d/TextFont/TextColor, not FontAtlas internals
[bevy.type_ignores.FontAtlas]
intentional_missing_methods = ["add_glyph", "get_glyph_index", "has_glyph", "new"]
intentional_missing_fields = ["dynamic_texture_atlas_builder", "glyph_to_atlas_index"]
intentional_readonly_properties = ["texture", "texture_atlas"]
ignore_constructor_warnings = true
notes = """
Methods and fields require types from text rendering pipeline not exposed in PyBevy:
- cosmic_text::CacheKey: External crate dependency, would need separate bindings
- GlyphAtlasLocation: Low-level glyph positioning, 0 usage in Bevy examples
- DynamicTextureAtlasBuilder: Internal atlas packing, from bevy_image
- TextError: Internal error type for pipeline failures
These are public in Bevy but intended for internal text rendering, not user code."""

