[[validation.exceptions]]
code = "W039"
reason = "Mesh.indices returns a live read-only zero-copy uint16/uint32 bounded array instead of Bevy's Option<&Indices>: Indices is an owned value whose push mutates in place, so a detached copy would silently drop those writes; edited buffers go back through insert_indices"
paths = [
    "mesh.Mesh.indices",
]

