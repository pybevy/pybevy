    { name = "spawn_sync", note = "Requires &mut World - use deferred spawn() instead" },
    { name = "spawn_dynamic_sync", note = "Requires &mut World - use deferred spawn_dynamic() instead" },
    { name = "spawn_queued_instances", note = "Internal method - called by world_instance_spawner_system" },
    { name = "despawn_sync", note = "Requires &mut World - use deferred despawn() instead" },
    { name = "despawn_dynamic_sync", note = "Requires &mut World - use deferred despawn_dynamic() instead" },
    { name = "despawn_instance_sync", note = "Requires &mut World - use deferred despawn_instance() instead" },
    { name = "despawn_queued_world_asset_instances", note = "Internal method - called by world_instance_spawner_system" },
    { name = "despawn_queued_dynamic_world_instances", note = "Internal method - called by world_instance_spawner_system" },
    { name = "update_spawned_instances", note = "Internal method - called by world_instance_spawner_system" },
