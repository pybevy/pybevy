    { name = "write_to_world_with", note = "Requires AppTypeRegistry, EntityHashMap, WorldInstanceSpawnError" },
]
intentional_missing_fields = [
    { name = "entities", note = "Contains DynamicEntity reflection type" },
    { name = "resources", note = "Contains Box<PartialReflect> reflection type" },
]
ignore_constructor_warnings = true

# WorldAsset: Asset loaded from files
[bevy.type_ignores.WorldAsset]
intentional_missing_methods = [
    { name = "new", note = "Use WorldAssetRoot(handle) component to spawn" },
    { name = "clone_with", note = "Requires AppTypeRegistry, WorldInstanceSpawnError" },
    { name = "from_dynamic_world", note = "Requires AppTypeRegistry, WorldInstanceSpawnError" },
    { name = "write_to_world_with", note = "Requires AppTypeRegistry, EntityHashMap, WorldInstanceSpawnError" },
]
intentional_missing_fields = [
    { name = "world", note = "World is not directly exposed to Python" },
]
ignore_constructor_warnings = true

# WorldAssetRoot: Handle wrapper component
[bevy.type_ignores.WorldAssetRoot]
intentional_missing_methods = ["as_asset_id", "default"]
notes = """
- as_asset_id: Use handle() which returns PyHandle (PyBevy's unified asset ID wrapper)
- default: Requires a WorldAsset handle - use WorldAssetRoot(handle) instead"""

# DynamicWorldRoot: Handle wrapper component
[bevy.type_ignores.DynamicWorldRoot]
intentional_missing_methods = ["as_asset_id", "default"]
notes = """
- as_asset_id: Use handle() which returns PyHandle (PyBevy's unified asset ID wrapper)
- default: Requires a DynamicWorld handle - use DynamicWorldRoot(handle) instead"""

# WorldInstanceReady: Message received when instance spawning completes
[bevy.type_ignores.WorldInstanceReady]
intentional_missing_methods = [
    { name = "event_target", note = "EntityEvent trait - use entity field instead" },
    { name = "event_target_mut", note = "EntityEvent trait - use entity field instead" },
]
ignore_constructor_warnings = true

# WorldInstanceSpawner: Resource for spawning/despawning world instances
# Sync methods require &mut World which doesn't fit PyBevy's system parameter model
[bevy.type_ignores.WorldInstanceSpawner]
intentional_missing_methods = [
    { name = "default", note = "Engine-managed resource, auto-inserted by WorldSerializationPlugin" },
    { name = "spawn_sync", note = "Requires &mut World - use deferred spawn() instead" },
    { name = "spawn_dynamic_sync", note = "Requires &mut World - use deferred spawn_dynamic() instead" },
    { name = "spawn_queued_instances", note = "Internal method - called by world_instance_spawner_system" },
    { name = "despawn_sync", note = "Requires &mut World - use deferred despawn() instead" },
    { name = "despawn_dynamic_sync", note = "Requires &mut World - use deferred despawn_dynamic() instead" },
    { name = "despawn_instance_sync", note = "Requires &mut World - use deferred despawn_instance() instead" },
    { name = "despawn_queued_world_asset_instances", note = "Internal method - called by world_instance_spawner_system" },
    { name = "despawn_queued_dynamic_world_instances", note = "Internal method - called by world_instance_spawner_system" },
    { name = "update_spawned_instances", note = "Internal method - called by world_instance_spawner_system" },
    { name = "update_spawned_dynamic_worlds", note = "Internal method - called by world_instance_spawner_system" },
]
notes = "Sync methods need &mut World which isn't available via Res/ResMut. Use deferred methods (spawn, despawn) in systems."

