# PyBevy Lint Configuration
# This file configures the linter's behavior for Bevy API comparison
[bevy]
# Path to Bevy source (relative to project root or absolute)
# Can be overridden with --bevy-path CLI option
# path = "~/Documents/rust/bevy"

# Types that are false matches across modules.
# When a Bevy type from one crate matches a PyBevy class from a different module
# by name only, but the types are actually unrelated, list them here to suppress
# the false match. The Bevy type will be treated as unimplemented instead.
# Format: "module::TypeName" (e.g., "ui::State")
false_match_types = [
    # bevy_ui::State is a focus tracking struct (FocusedEntity tracking),
    # not the same as PyBevy's State which is an ECS state machine.
    "ui::State",
]

# Registered component wrappers whose Bevy types do not expose reflection data.
# Keep these in the generated oracle coverage on every interpreter backend.
reflection_unavailable_types = [
    "AtmosphereSettings",
    "Exposure",
    "ForwardDecal",
    "LensDistortion",
    "Strikethrough",
    "Underline",
]

# Module placement overrides: types intentionally in a different PyBevy module
# Format: "bevy_module::Type" = "pybevy_module"
[bevy.module_placement_overrides]
# Base classes in pybevy_core, exported from pybevy.ecs at Python level
"ecs::ChildOf" = "core"
"ecs::Children" = "core"
"ecs::MessageId" = "core"
# Handle/AssetPath in pybevy_core, exported from pybevy.assets at Python level
"asset::AssetPath" = "core"

# Crate mappings: pybevy_module -> bevy_crate
# Maps PyBevy source directories to corresponding Bevy crates
[bevy.crate_type_sources]
bevy_math = ["glam"]

[bevy.crate_mappings]
transform = "bevy_transform"
ecs = "bevy_ecs"
app = "bevy_app"
time = "bevy_time"
math = "bevy_math"
render = "bevy_render"
pbr = "bevy_pbr"
post_process = "bevy_post_process"
sprite = "bevy_sprite"
camera = "bevy_camera"
core_pipeline = "bevy_core_pipeline"
gizmos = "bevy_gizmos"
light = "bevy_light"
window = "bevy_window"
assets = "bevy_asset"
mesh = "bevy_mesh"
material = "bevy_material"
color = "bevy_color"
gltf = "bevy_gltf"
world_serialization = "bevy_world_serialization"
animation = "bevy_animation"
audio = "bevy_audio"
image = "bevy_image"
input = "bevy_input"
ui = "bevy_ui"
text = "bevy_text"
a11y = "bevy_a11y"
winit = "bevy_winit"
shader = "bevy_shader"

# Bevy crates to exclude from comparison (not relevant for Python bindings)
[bevy.excluded_crates]
crates = [
    "bevy_android",
    "bevy_derive",
    "bevy_dylib",
    "bevy_encase_derive",
    "bevy_internal",
    "bevy_macro_utils",
    "bevy_ptr",
    "bevy_reflect",
    "bevy_tasks",
    "bevy_utils",
    "bevy_feathers",
    "bevy_diagnostic",
    "bevy_dev_tools",
    "bevy_remote",
    "bevy_log",
]

# Types to exclude from comparison (internal, derive-only, or not useful for Python)
[bevy.excluded_types]
# Patterns can use wildcards: "Reflect*", "*Builder", etc.
patterns = [
    "*Builder",
    "*Plugin",
    "*Systems",
    "*Set",
    "*Schedule",
    "Reflect*",
    "*Reflect",
    "*TypePath",
    "*TypeData",
]

# Engine-managed component types that don't need user-constructable defaults.
# These are inserted/managed by Bevy's internal systems, not user code.
# The linter will skip `default()` method warnings for these types.
engine_managed_types = [
    "InheritedVisibility",  # Managed by Bevy's visibility system
    "ViewVisibility",       # Managed by Bevy's visibility system
    "Children",             # Managed by Bevy's hierarchy system
    "ComputedNode",         # Computed by Bevy's UI layout system
    "FontAtlasSet",         # Managed by Bevy's text rendering system
    "GlobalTransform",      # Computed by Bevy's transform propagation
    "Cascades",             # Computed by Bevy's shadow cascade system
]

# Types intentionally excluded despite appearing in Bevy examples.
# These won't trigger audit warnings. Use for types where PyBevy has an
# alternative API (e.g., schedule labels replaced by Stage enum).
audit_ignore = [
    # Schedule labels - PyBevy uses Stage enum instead of individual types
    "app::First",
    "app::FixedFirst",
    "app::FixedLast",
    "app::FixedMain",
    "app::FixedPostUpdate",
    "app::FixedPreUpdate",
    "app::FixedUpdate",
    "app::Last",
    "app::Main",
    "app::PostStartup",
    "app::PostUpdate",
    "app::PreStartup",
    "app::PreUpdate",
    "app::Startup",
    "app::Update",

    # Time - PyBevy implements concrete specializations (Time<Virtual>, etc.)
    "time::Time<T>",

    # Low-level rendering types - not useful in Python API
    "MeshVertexBufferLayoutRef",
    "VertexBufferLayout",

    # ECS internals - unsafe/low-level Rust types not applicable to Python
    "ecs::EntityWorldMut",
    "ecs::UnsafeWorldCell",
    "ecs::ComponentHooks",
    "ecs::SystemState",

    # Geometry internals
    "ConvexPolygon",
