# Intentional read-only properties (W007 suppressions)
#
# Properties that are intentionally read-only (getter without setter).
# Suppress W007 warnings for these properties.
#
# Categories:
# - Direction types: Setting x/y/z would break normalization invariant
# - Matrix types: Complex internal structure, use methods to modify
# - Computed/derived values: Calculated from other data
# - Asset system: Read-only by design
# - Engine-managed: State managed by Bevy, not user-modifiable

# Direction types - normalized, setting components breaks invariant
[bevy.type_ignores.Dir2]
intentional_readonly_properties = ["x", "y"]
notes = "Normalized direction - setting x/y individually would break normalization"

[bevy.type_ignores.Dir3]
intentional_readonly_properties = ["x", "y", "z"]
notes = "Normalized direction - setting x/y/z individually would break normalization"

# Rotation type - cos²+sin²=1 invariant, param renames
[bevy.type_ignores.Rot2]
intentional_readonly_properties = ["cos", "sin"]
intentional_signature_diffs = [
    { name = "nlerp", expected_params = { "rhs" = "PyRot2" } },
    { name = "slerp", expected_params = { "rhs" = "PyRot2" } },
    "sin_cos",
]
notes = """
- cos/sin: Read-only (cos²+sin²=1 invariant), use from_radians/degrees
- nlerp/slerp: end renamed to rhs for consistency
- sin_cos: tuple return formatting diff"""

# Half-space - computed/geometric
[bevy.type_ignores.HalfSpace]
intentional_readonly_properties = ["normal", "d", "normal_d"]
notes = "Geometric properties computed from plane equation"

# Curve - computed
[bevy.type_ignores.CubicCurve2d]
intentional_readonly_properties = ["segment_count"]
notes = "Computed from curve segments"

# Indices - derived length
[bevy.type_ignores.Indices]
intentional_readonly_properties = ["len"]
notes = "Length is derived from indices data"

# Asset system - read-only by design
[bevy.type_ignores.AssetPath]
intentional_readonly_properties = ["path", "source", "label"]
notes = "Asset paths are immutable once created"

[bevy.type_ignores.AssetEvent]
intentional_readonly_properties = ["is_added", "asset"]
intentional_signature_diffs = ["is_added", "is_loaded_with_dependencies", "is_modified", "is_removed", "is_unused"]
notes = "Event properties are read-only; variant predicates inspect self instead of accepting an asset ID"

[bevy.type_ignores.Handle]
intentional_readonly_properties = ["asset_type"]
notes = "Handle asset type is fixed at creation"

[bevy.type_ignores.LoadedFolder]
intentional_readonly_properties = ["handles"]
notes = "Loaded folder contents are read-only"

[bevy.type_ignores.AssetTypeParam]
intentional_readonly_properties = ["asset_type"]
notes = "Asset type parameter is fixed"

# Image: read-only properties + intentional type wrapping and param renames
[bevy.type_ignores.Image]
intentional_extra_methods = ["_content_hash"]
intentional_readonly_properties = ["dimension", "format", "mip_level_count"]
intentional_signature_diffs = [
    { name = "aspect_ratio", expected_return = "f32" },
    { name = "convert", expected_return = "Option<Py<PyImage>>" },
    { name = "pixel_bytes_mut", expected_return = "ImagePixelContextMut" },
    { name = "reinterpret_size", expected_params = { "size" = "PyExtent3d" } },
    { name = "resize_in_place", expected_params = { "size" = "PyExtent3d" } },
]
notes = """
- _content_hash: Internal PyBevy snapshot/regression hook with a versioned canonical format
- Read-only properties derived from texture_descriptor
- aspect_ratio: Returns f32 instead of AspectRatio
- convert: Return type wrapping
- pixel_bytes_mut: Returns ImagePixelContextMut wrapper for safe mutation
- reinterpret_size/resize_in_place: Param renamed new_size → size"""

# Cascade shadow - engine-managed
[bevy.type_ignores.Cascade]
intentional_readonly_properties = ["cascades_texture_size", "far_bound", "texel_size", "min_distance_bias"]
notes = "Shadow cascade properties computed by engine"

[bevy.type_ignores.Cascades]
intentional_readonly_properties = ["cascades"]
ignore_constructor_warnings = true
notes = "Engine-managed component - cascade data computed by Bevy's shadow system, not user-constructable"

[bevy.type_ignores.CameraMainTextureUsages]
intentional_missing_methods = ["to_dynamic"]
renames = { "with" = "with_" }
notes = "with_ escapes the Python keyword; value preserves component borrowing and writability. to_dynamic needs PartialReflect."

