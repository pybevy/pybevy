[[validation.exceptions]]
code = "E018"
path = "transform.Transform"
message = "PyTransform::translation writes a declared domain without calling borrow_validated_field_as with validate_translation"
reason = "Nested query writes such as transform.translation.x stay unchecked like View and Numba: validating them would move the hottest Python write path onto the staged validated borrow (field domains design, decision 1)"

