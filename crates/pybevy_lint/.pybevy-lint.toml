# Shader: generic params specialized to String
[bevy.type_ignores.Shader]
intentional_signature_diffs = ["from_glsl", "from_wgsl_with_defs"]
notes = """
- from_glsl: naga::ShaderStage -> pybevy.shader.ShaderStage (wrapper naming), and
  impl Into<Cow<str>>/impl Into<String> specialized to str
- from_wgsl_with_defs: Vec<ShaderDefVal> -> Vec<PyShaderDefVal> (wrapper naming)"""

[bevy.type_ignores.ShaderBuffer]
intentional_signature_diffs = ["with_size"]
intentional_missing_fields = ["asset_usage", "buffer_description"]
intentional_extra_methods = ["data_mut", "data_copy", "data_len"]
notes = """
- with_size/asset_usage: the current RenderAssetUsages wrapper is owned by
  pybevy_image, which already depends on pybevy_render; its Python module is
  pybevy.assets, but Rust ownership still prevents importing it here, so this
  wrapper supplies Bevy's default without creating a dependency cycle
- buffer_description: wgpu BufferDescriptor is not exposed; resize methods are
  the supported size mutation boundary
- copy_on_resize is an independent keyword-only field override after Bevy's
  mapped new() prefix
- data is exposed through guarded CPU byte contexts, not a detached property;
  data_copy is an explicit snapshot and data_len reports optional CPU length
- set_data accepts already encoded bytes or uint8 Array instead of Bevy's
  ShaderType serialization; None clears the optional CPU payload
- no CPU accessor claims to report live GPU allocation size"""

