# PyBevy Lint Configuration
# This file configures the linter's behavior for Bevy API comparison
# Types borrowed as a shared PyRef across calls back into Python.
# See docs/safety.md, "Shared-Borrow Proxies".
[[validation.shared_borrow_types]]
path = "ecs.Commands"
reason = "its &self methods hold the receiver borrow across component conversion, which is arbitrary Python and can re-enter the same Commands"

[[validation.shared_borrow_types]]
path = "ecs.EntityCommands"
reason = "with_children holds the receiver borrow across the user callback, which can reach the same handle"

[[validation.shared_borrow_types]]
path = "ecs.RelatedSpawnerCommands"
reason = "its &self spawn methods hold the receiver borrow across component conversion, which is arbitrary Python and receives the spawner"

[[validation.specialized_receivers]]
path = "time.Time[Virtual]"
rust_type = "PyTimeVirtual"
reason = "PyTime.__class_getitem__ returns PyTimeVirtual for Virtual"

[[validation.specialized_receivers]]
path = "time.Time[Fixed]"
rust_type = "PyTimeFixed"
reason = "PyTime.__class_getitem__ returns PyTimeFixed for Fixed"

[bevy]
# Path to Bevy source (relative to project root or absolute)
# Can be overridden with --bevy-path CLI option
# path = "~/Documents/rust/bevy"

# Types that are false matches across modules.
# When a Bevy type from one crate matches a PyBevy class from a different module
# by name only, but the types are actually unrelated, list them here to suppress
# the false match. The Bevy type will be treated as unimplemented instead.
# Format: "module::TypeName" (e.g., "ui::State")
false_match_types = [
    # bevy_ui::State is a focus tracking struct (FocusedEntity tracking),
    # not the same as PyBevy's State which is an ECS state machine.
    "ui::State",
]

# Registered component wrappers whose Bevy types do not expose reflection data.
# Keep these in the generated oracle coverage on every interpreter backend.
reflection_unavailable_types = [
    "AtmosphereSettings",
    "Exposure",
    "ForwardDecal",
    "LensDistortion",
    "Strikethrough",
    "Underline",
]

# Module placement overrides: types intentionally in a different PyBevy module
# Format: "bevy_module::Type" = "pybevy_module"
[bevy.mapping_overrides.VisibleMeshEntities.entities]
exclude_reason = "Bevy marks the field #[reflect(ignore)], so reflection cannot observe it"

[bevy.module_placement_overrides]
# Base classes in pybevy_core, exported from pybevy.ecs at Python level
"ecs::ChildOf" = "core"
"ecs::Children" = "core"
"ecs::MessageId" = "core"
# Handle/AssetPath in pybevy_core, exported from pybevy.assets at Python level
"asset::AssetPath" = "core"

# Crate mappings: pybevy_module -> bevy_crate
# Maps PyBevy source directories to corresponding Bevy crates
[bevy.crate_type_sources]
bevy_math = ["glam"]
bevy_mesh = ["bevy_sprite_render"]
bevy_sprite = ["bevy_sprite_render"]
bevy_animation = ["petgraph"]

# External sources used only for enum topology and trait contracts. Keeping
# structs out avoids treating cargo-public-api's sorted fields as source order.
[bevy.crate_enum_sources]
bevy_render = ["wgpu-types"]

[bevy.crate_mappings]
transform = "bevy_transform"
ecs = "bevy_ecs"
app = "bevy_app"
time = "bevy_time"
math = "bevy_math"
render = "bevy_render"
pbr = "bevy_pbr"
post_process = "bevy_post_process"
sprite = "bevy_sprite"
camera = "bevy_camera"
