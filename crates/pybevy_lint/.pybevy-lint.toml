# Bevy crates to exclude from comparison (not relevant for Python bindings)
[bevy.excluded_crates]
crates = [
    "bevy_android",
    "bevy_derive",
    "bevy_dylib",
    "bevy_encase_derive",
    "bevy_internal",
    "bevy_macro_utils",
    "bevy_ptr",
