notes = "Aggregate predicates over active animations, not stored writable fields."


[bevy.type_ignores.EditableText]
intentional_readonly_properties = ["value"]
notes = "Native value() reads the editor's private text state; queue_edit and clear preserve cursor and pending-edit coherence."


[bevy.type_ignores.UiGlobalTransform]
