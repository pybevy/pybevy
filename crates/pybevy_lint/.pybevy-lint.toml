# Types to exclude from comparison (internal, derive-only, or not useful for Python)
[bevy.excluded_types]
# Patterns can use wildcards: "Reflect*", "*Builder", etc.
patterns = [
    "*Builder",
    "*Plugin",
    "*Systems",
    "*Set",
    "*Schedule",
    "Reflect*",
    "*Reflect",
    "*TypePath",
    "*TypeData",
]

# Engine-managed component types that don't need user-constructable defaults.
# These are inserted/managed by Bevy's internal systems, not user code.
# The linter will skip `default()` method warnings for these types.
engine_managed_types = [
    "InheritedVisibility",  # Managed by Bevy's visibility system
    "ViewVisibility",       # Managed by Bevy's visibility system
    "Children",             # Managed by Bevy's hierarchy system
    "ComputedNode",         # Computed by Bevy's UI layout system
    "FontAtlasSet",         # Managed by Bevy's text rendering system
    "GlobalTransform",      # Computed by Bevy's transform propagation
    "Cascades",             # Computed by Bevy's shadow cascade system
]

