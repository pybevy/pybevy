# Per-property W007 dispositions audited against crates/pybevy_gpu native sources.
# Status/diagnostic resources have no_mut/no_insert/no_remove; their counters are
# owned by GPU schedules. Component configuration fields are private and their
# constructors validate cross-field invariants, so replacement requires a new component.

[bevy.type_ignores.Array]
intentional_readonly_properties = ["dtype", "itemsize", "ndim", "shape", "size", "strides"]
notes = "Derived array layout and dtype metadata; resizing/retyping is not an in-place operation."

# ECS type descriptors and validity-fenced opaque Numba view metadata.
[bevy.type_ignores.Mut]
intentional_readonly_properties = ["inner_type", "value"]
notes = "Internal proxy type/value references; assignment is delegated to the wrapped value."
[bevy.type_ignores.Local]
intentional_readonly_properties = ["value_type"]
notes = "The Local type is fixed at registration; current is the explicit mutable value property."
[bevy.type_ignores.ViewColumn]
intentional_readonly_properties = ["dtype", "is_valid", "len", "ptr", "stride", "writable"]
notes = "Validity-fenced opaque Numba view metadata; ptr and layout must never be assignable."

# GlobalTransform is derived by Bevy transform propagation, not user-authored state.
[bevy.type_ignores.GlobalTransform]
intentional_readonly_properties = ["rotation", "scale", "translation"]
notes = "Computed decomposition of the engine-derived global affine transform."

[bevy.type_ignores.Interval]
intentional_readonly_properties = ["start", "end"]
notes = "Bevy keeps interval endpoints private to enforce a nonempty, NaN-free interval; use the checked constructor or intersect()."

[bevy.type_ignores.WindowResolution]
intentional_readonly_properties = ["width", "height", "physical_width", "physical_height", "scale_factor", "base_scale_factor"]
notes = "Derived and backend-managed resolution values; use Bevy's set, set_physical_resolution, set_scale_factor, and set_scale_factor_override methods. Bevy WindowResolution keeps physical dimensions and scale factors private."


[bevy.type_ignores.CursorIcon]
intentional_readonly_properties = ["as_system"]
notes = "Computed optional projection of the CursorIcon enum; set_system is the native mutation API and no property assignment can represent a custom icon."


[bevy.type_ignores.Monitor]
intentional_readonly_properties = ["name", "physical_height", "physical_width", "physical_position", "refresh_rate_millihertz", "scale_factor", "video_modes"]
notes = "Bevy's Monitor documentation calls the winit-synchronized component effectively read-only because winit cannot change monitor properties."


[bevy.type_ignores.WindowFocused]
intentional_readonly_properties = ["focused", "window"]
notes = "The wrapper does not opt into pymessage writable; MessageBridge exposes this engine-reported channel as read-only."


[bevy.type_ignores.WindowResized]
intentional_readonly_properties = ["width", "height", "window"]
notes = "The wrapper does not opt into pymessage writable; MessageBridge exposes this engine-reported channel as read-only."


[bevy.type_ignores.WindowCloseRequested]
intentional_readonly_properties = ["window"]
notes = "The wrapper does not opt into pymessage writable; MessageBridge exposes this engine-reported channel as read-only."


[bevy.type_ignores.PinchGesture]
intentional_extra_methods = ["value"]
intentional_readonly_properties = ["value"]
notes = "The wrapper does not opt into pymessage writable; MessageBridge exposes this platform gesture channel as read-only."


[bevy.type_ignores.RotationGesture]
intentional_extra_methods = ["value"]
intentional_readonly_properties = ["value"]
notes = "The wrapper does not opt into pymessage writable; MessageBridge exposes this platform gesture channel as read-only."


[bevy.type_ignores.PanGesture]
intentional_readonly_properties = ["value", "x", "y", "delta"]
notes = "The wrapper does not opt into pymessage writable; MessageBridge exposes this platform gesture channel as read-only, and x, y, and delta are computed projections of the Vec2 payload."


[bevy.type_ignores.Touch]
intentional_readonly_properties = ["id", "position", "start_position", "previous_position", "force", "start_force", "previous_force"]
notes = "Touch is an immutable snapshot materialized from Bevy's private touch-tracking state; position and force histories must remain coherent."


[bevy.type_ignores.ActiveAnimation]
