[package]
name = "pybevy-python"
version = "0.2.1"
edition = "2024"
description = "Python extension module (cdylib) for PyBevy"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/pybevy/pybevy"
homepage = "https://pybevy.com"

[lib]
name = "_pybevy"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
pybevy = { path = "../..", version = "=0.2.1" }
pyo3 = { workspace = true }

[features]
default = ["pybevy/mcp", "linux-display"]
linux-display = ["pybevy/linux-display"]
debug = ["pybevy/debug"]
mcp = ["pybevy/mcp"]

[lints]
workspace = true
