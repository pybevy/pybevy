[package]
name = "pybevy_pbr"
version = "0.3.0"
edition = "2024"
description = "PBR components for PyBevy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pybevy/pybevy"
homepage = "https://pybevy.com"

[dependencies]
pyo3 = { workspace = true, features = ["macros"] }
pybevy_color = { workspace = true }
pybevy_core = { workspace = true }
pybevy_macros = { workspace = true }
pybevy_material = { workspace = true }
pybevy_math = { workspace = true }
pybevy_mesh = { workspace = true }
pybevy_render = { workspace = true }
numpy = { workspace = true }
pybevy_shader_types = { workspace = true }

[features]
# Forwards bevy's gated field so this crate can name it. Enabled by the root
# crate on non-Apple targets only: Metal's 16-sampler-per-stage limit.
pbr_anisotropy_texture = ["bevy/pbr_anisotropy_texture"]
pbr_transmission_textures = ["bevy/pbr_transmission_textures"]
pbr_specular_textures = ["bevy/pbr_specular_textures"]
pbr_multi_layer_material_textures = ["bevy/pbr_multi_layer_material_textures"]

[dependencies.bevy]
workspace = true
features = ["bevy_pbr", "bevy_render"]

[lints]
workspace = true
