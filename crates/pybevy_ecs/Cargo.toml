[package]
name = "pybevy_ecs"
version = "0.3.0"
edition = "2024"
description = "ECS components for PyBevy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pybevy/pybevy"
homepage = "https://pybevy.com"

[features]
default = ["pyo3"]
pyo3 = ["dep:pyo3", "dep:pybevy_core", "dep:pybevy_macros"]

[dependencies]
pyo3 = { workspace = true, features = ["macros"], optional = true }
pybevy_core = { workspace = true, optional = true }
pybevy_macros = { workspace = true, optional = true }
pybevy_storage = { path = "../pybevy_storage", version = "=0.3.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { workspace = true }

[dependencies.bevy]
workspace = true
features = []

[lints]
workspace = true
