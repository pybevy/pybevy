[package]
name = "pybevy_gltf"
version = "0.2.0"
edition = "2024"
description = "GLTF components for PyBevy"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pybevy/pybevy"
homepage = "https://pybevy.com"

[dependencies]
pyo3 = { workspace = true, features = ["macros"] }
pybevy_core = { workspace = true }
pybevy_image = { workspace = true }
pybevy_macros = { workspace = true }
pybevy_transform = { workspace = true }

[dependencies.bevy]
workspace = true
features = ["bevy_gltf"]
