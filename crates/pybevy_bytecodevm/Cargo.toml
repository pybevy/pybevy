[package]
name = "pybevy_bytecodevm"
version = "0.3.0"
edition = "2024"
description = "Bytecode VM for PyBevy expressions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pybevy/pybevy"
homepage = "https://pybevy.com"

[features]
default = []
parallel = ["dep:rayon"]

[dependencies]
pyo3.workspace = true
bevy_ecs = { workspace = true }
smallvec = "1.0"
rayon = { version = "1.10", optional = true }
pybevy_storage = { path = "../pybevy_storage", version = "=0.3.0" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "vm_pool"
harness = false

[[bench]]
name = "tiled_vs_scalar"
harness = false

[[bench]]
name = "view_assignment"
harness = false

[lints]
workspace = true
