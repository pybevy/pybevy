[package]
name = "pybevy_shader_types"
version = "0.3.0-rc.1"
edition = "2024"
description = "Shared ShaderMaterial types for PyBevy — no Python dependencies"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pybevy/pybevy"
homepage = "https://pybevy.com"

[dependencies]
bytemuck = "1.24"
tracing = "0.1"
naga = { version = "29", default-features = false, features = ["wgsl-in"] }

[dependencies.bevy]
workspace = true
default-features = false
features = [
    "bevy_pbr",
    "bevy_render",
    "bevy_asset",
]

[lints]
workspace = true
