[project]
name = "pybevy"
version = "0.2.1"
description = "PyBevy: A Python Real-Time Engine Built on Bevy"
requires-python = ">=3.12,<4.0"
dependencies = ["click ~= 8.3", "watchfiles ~= 1.1", "numpy (>=2.3.2,<2.4)", "httpx >= 0.27"]
authors = [{ name = "PyBevy Team", email = "info@pybevy.com" }]
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
dynamic = ["classifiers"]

[project.optional-dependencies]
numba = ["numba (>=0.62.1)"]
jax = ["jax (>=0.4.30)", "jaxlib (>=0.4.30)"]

[project.urls]
Homepage = "https://pybevy.com"
Repository = "https://github.com/pybevy/pybevy"
"Bug Tracker" = "https://github.com/pybevy/pybevy/issues"

[project.scripts]
pybevy = "pybevy.cli:main"

[tool.poetry]
requires-poetry = ">=2.0"
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.1"
maturin = { extras = ["patchelf"], version = "^1.9.2" }
mypy = "^1.17.1"
ruff = "^0.12.7"
numba = "^0.62.1"
pytest-benchmark = "^5.1.0"
pytest-xdist = "^3.8.0"
pillow = "^12.1.1"
types-pillow = "^10.2.0"
jax = {extras = ["cpu"], version = "^0.9.1"}
pytest-cov = "^7.0.0"

[tool.poetry.group.eval]
optional = true

[tool.poetry.group.eval.dependencies]
anthropic = ">=0.40"
deepeval = ">=2.0"
pyyaml = ">=6.0"

[build-system]
requires = ["maturin>=1.8,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/pybevy_python/Cargo.toml"
module-name = "pybevy._pybevy"
include = ["pybevy", "LICENSE-APACHE", "LICENSE-MIT"]
exclude = ["target"]
python-packages = []

[tool.ruff]
lint.select = ["ANN", "F", "B", "UP", "PLC0415", "I", "PIE", "C4", "RET", "RUF", "T20", "SIM", "A", "PT"]
lint.ignore = [
    "SIM117",  # Nested with statements - often intentional for pytest.raises context order
    "PT013",   # `from pytest import approx` is fine, don't require `import pytest`
    "PT012",   # Multi-statement pytest.raises blocks are sometimes clearer
    "PT017",   # Assertion in except block - sometimes needed for complex error checking
    "PT019",   # False positive: PyBevy system params like `_: Query[T]` aren't fixtures
    "A002",    # Allow `id` parameter shadowing - matches Bevy API naming
    "A004",    # Allow `input` import shadowing - module name matches Bevy
]
line-length = 88
exclude = [
    "examples/rust",
    "target",
    "tests/types",   # Type-checking tests use reveal_type()
]

[tool.ruff.lint.per-file-ignores]
"docs/learn/*" = ["ANN201", "ANN204"]
"examples/*" = ["ANN001", "ANN201", "ANN204", "F403", "F405", "T201"]
"examples/complex/*" = ["ANN001", "ANN202", "F403", "F405", "T201", "SIM102"]  # Numba/Newton: can't annotate, nested ifs intentional
"benches/*" = ["ANN001", "ANN201", "ANN202", "ANN204", "F403", "F405", "PLC0415", "T20"]  # Relaxed in benchmarks
"pybevy/*.pyi" = [
    "B008",    # Function calls in defaults OK in stubs
    "PYI021",  # Docstrings intentional for IDE hints
    "PYI011",  # Typed defaults `= None` style OK
    "PYI036",  # *args/**kwargs annotation style OK
    "PYI059",  # Generic[] ordering flexible in stubs
    "PYI046",  # Private TypeVars for internal use
    "UP046",   # Keep Generic[T] syntax for Python 3.11 compat
    "UP047",   # Keep TypeVar generic style for compat
    "UP044",   # Keep Unpack[] syntax for compat
    "SIM105",  # try-except-pass OK for optional imports
    "ANN401",  # Any is needed for dynamic APIs (__getattr__, etc)
    "ANN001",  # __exit__ params don't need full types
    "A001",    # Allow shadowing builtins (abs, min, max, round) in expr module
]
"tests/cli/*" = ["T20"]  # CLI tests use print for E2E debugging
"pybevy/util/hot_reload.py" = ["T20", "PLC0415"]  # Print for logging, inline imports OK
"pybevy/__init__.py" = ["RUF022"]  # __all__ has logical grouping with comments
"pybevy/prelude.py" = ["RUF022"]  # __all__ has logical grouping
"pybevy/cli.py" = ["T20", "PLC0415", "SIM118"]  # CLI uses print, deferred imports
"pybevy/ecs/conditions.py" = ["ANN", "PLC0415"]  # Runtime imports to avoid circular deps
"pybevy/decorators.py" = ["T20", "PLC0415", "UP047"]  # Verbose logging, deferred imports, generic style
"pybevy/ecs/numba_ext.py" = ["ANN", "UP007", "UP008", "UP038", "RET503", "B904", "SIM102"]  # Numba special requirements
"pybevy/contrib/*.py" = ["PLC0415"]  # Deferred imports to avoid circular deps
"pybevy/expr.py" = ["A001"]  # Math functions intentionally shadow builtins (abs, min, max, round)
"tests/mcp/test_getset_descriptor_detection.py" = ["PLC0415"]  # Deferred imports for optional module isolation
"eval/*" = ["T20", "ANN201", "ANN001", "ANN401", "PLC0415"]  # Eval: print, relaxed annotations, deferred imports

[tool.mypy]
check_untyped_defs = true
exclude = [
    "examples/rust",
    "examples/complex/crystalline_cavern.py",  # duplicate type from camera/render re-export
    "target",
]

[[tool.mypy.overrides]]
module = "pytest_benchmark.fixture"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numba.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "deepeval.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--benchmark-sort=name --continue-on-collection-errors --ignore=tests/types -m 'not window' -p no:deepeval"
markers = [
    "window: marks tests requiring DefaultPlugins (deselected by default due to event loop limitation)",
]

[tool.coverage.run]
source = ["pybevy"]

[tool.coverage.report]
fail_under = 90
